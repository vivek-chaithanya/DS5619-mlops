# Week 7 — CI/CD integration testing
# Three jobs:
#   lint            - flake8 over week-7/src/
#   unit-test       - pytest week-7/tests/ (the Flask-test-client tests, no Docker needed)
#   integration-test - build the Docker image, run it, curl it via
#                      week-7/scripts/integration_test.sh, then tear it down.
#
# integration-test should only run after lint and unit-test both pass (use
# `needs:`) — no point spending minutes building a container for code that
# doesn't even lint or pass its unit tests.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: week-7
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint
        run: flake8 src/

  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: week-7
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/ -q

  integration-test:
    runs-on: ubuntu-latest
    needs: ["lint", "unit-test"]
    defaults:
      run:
        working-directory: week-7
    steps:
      - uses: actions/checkout@v4
      - name: Run integration test
        run: |
          chmod +x scripts/integration_test.sh
          ./scripts/integration_test.sh